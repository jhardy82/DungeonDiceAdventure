[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battle-dice"
version = "0.1.0"
description = "Battle Dice: a single-player, turn-based tactical fantasy dice RPG (MVP vertical slice)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
battle-dice = "battle_dice.__main__:main"
battle-dice-sim = "battle_dice.sim.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/battle_dice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
