[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battle-dice"
version = "0.1.0"
description = "Battle Dice: a single-player, turn-based tactical fantasy dice RPG (MVP vertical slice)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pygame-ce>=2.5.8",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.17.4",
    "mypy>=2.4",
]
package = [
    "pyinstaller>=6.22.3",
]

[project.scripts]
battle-dice = "battle_dice.__main__:main"
battle-dice-sim = "battle_dice.sim.runner:main"
battle-dice-replay = "battle_dice.replay_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/battle_dice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.15"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Tests read optional engine state directly (engine.combat.turn.rolled): if it is None the test
# fails with an AttributeError, which is the signal wanted. Every other check applies to tests too.
module = "tests.*"
disable_error_code = ["union-attr"]
