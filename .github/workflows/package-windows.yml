name: Package (Windows)

on:
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/**"
      - "Play-BattleDice.cmd"
      - ".gitattributes"
      - "pyproject.toml"
      - ".github/workflows/package-windows.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Launcher check and standalone build
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Lint the launcher script
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $findings = Invoke-ScriptAnalyzer -Path scripts/Start-BattleDice.ps1 -Severity Warning, Error
          $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($findings) { exit 1 }

      - name: Launcher set-up in Windows PowerShell 5.1 (first run installs)
        shell: powershell
        run: |
          .\scripts\Start-BattleDice.ps1 -NoLaunch 6>&1 | Tee-Object -FilePath launcher-first.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path launcher-first.txt -Pattern 'Installing Battle Dice' -Quiet)) {
            Write-Error 'The first launcher run should have installed the game.'; exit 1
          }

      - name: Launcher is idempotent in PowerShell 7 (second run installs nothing)
        shell: pwsh
        run: |
          .\scripts\Start-BattleDice.ps1 -NoLaunch 6>&1 | Tee-Object -FilePath launcher-second.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path launcher-second.txt -Pattern 'already installed and up to date' -Quiet)) {
            Write-Error 'The second launcher run should have found everything in place.'; exit 1
          }

      - name: Launcher accepts an explicit -Python path and rebuilds from it
        shell: powershell
        run: |
          $exe = (Get-Command python).Source
          .\scripts\Start-BattleDice.ps1 -Python $exe -Reinstall -NoLaunch 6>&1 | Tee-Object -FilePath launcher-explicit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = (Get-Content -Raw launcher-explicit.txt) -replace '\s+', ' '
          if ($text -notmatch 'Creating \.venv with Python 3\.15') {
            Write-Error 'The launcher should have rebuilt .venv from the explicit Python.'; exit 1
          }

      - name: Launcher finds Python 3.15 when it is not on PATH (registry search)
        shell: powershell
        run: |
          # Hide every python and the py launcher from PATH, then register this interpreter the way an
          # installer does (PEP 514), so only the registry search can find it.
          $exe = (Get-Command python).Source
          $key = 'HKCU:\Software\Python\BattleDiceCI\3.15'
          New-Item -Path "$key\InstallPath" -Force | Out-Null
          Set-ItemProperty -Path "$key\InstallPath" -Name 'ExecutablePath' -Value $exe
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          if ((Get-Command python -ErrorAction SilentlyContinue) -or (Get-Command py -ErrorAction SilentlyContinue)) {
            Write-Error 'python or py is still on PATH; the test would prove nothing.'; exit 1
          }
          .\scripts\Start-BattleDice.ps1 -Reinstall -NoLaunch -Verbose 6>&1 4>&1 | Tee-Object -FilePath launcher-registry.txt
          $code = $LASTEXITCODE
          Remove-Item -Path 'HKCU:\Software\Python\BattleDiceCI' -Recurse -Force
          if ($code -ne 0) { exit $code }
          $text = (Get-Content -Raw launcher-registry.txt) -replace '\s+', ' '
          if ($text -notmatch 'Creating \.venv with Python 3\.15') {
            Write-Error 'The launcher should have found Python 3.15 without PATH.'; exit 1
          }
          if ($text -notmatch 'Using [A-Za-z]:\\') {
            Write-Error 'Python 3.15 should have been found by path (install folder or registry), not by a command on PATH.'; exit 1
          }

      - name: A failed -Reinstall says why and keeps the working .venv
        shell: powershell
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          # cmd merges the child's stderr into plain text, so the message is compared as the player sees it.
          $output = cmd /c "powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Start-BattleDice.ps1 -Python C:\no\such\python.exe -Reinstall -NoLaunch 2>&1" | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 1) { Write-Error "Expected exit code 1, got $code."; exit 1 }
          $flat = $output -replace '\s+', ' '
          if ($flat -notmatch '\[Battle Dice\] The -Python path is not a working Python 3\.15 or newer\. It does not exist or does not run\.') {
            Write-Error 'The failure message should be one plain line saying the -Python path is not a working Python.'; exit 1
          }
          if ($flat -notmatch 'The existing \.venv was kept and still works') {
            Write-Error 'The message should say that the existing .venv was kept.'; exit 1
          }
          if ($flat -match 'CategoryInfo|FullyQualifiedErrorId|Removing the existing \.venv') {
            Write-Error 'The message is wrapped in an error record, or .venv was removed before a Python was found.'; exit 1
          }
          & .\.venv\Scripts\python.exe -c "import battle_dice"
          if ($LASTEXITCODE -ne 0) { Write-Error 'The .venv no longer works after the failed reinstall.'; exit 1 }
          exit 0

      - name: Launcher reinstalls when the checkout was moved, and repairs a broken install
        shell: powershell
        run: |
          $stampFile = '.venv\.battle-dice-install-stamp'
          $stamp = (Get-Content -LiteralPath $stampFile -TotalCount 1).Trim()
          # Pretend the install was made from another folder.
          Set-Content -LiteralPath $stampFile -Value ($stamp.Split('|')[0] + '|C:\somewhere\else') -Encoding UTF8
          .\scripts\Start-BattleDice.ps1 -NoLaunch 6>&1 | Tee-Object -FilePath launcher-moved.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path launcher-moved.txt -Pattern 'the checkout was moved or renamed' -Quiet)) {
            Write-Error 'A different checkout folder in the install record should cause a reinstall.'; exit 1
          }
          # Remove the game from .venv behind the launcher's back.
          & .\.venv\Scripts\python.exe -m pip uninstall -y battle-dice | Out-Null
          .\scripts\Start-BattleDice.ps1 -NoLaunch 6>&1 | Tee-Object -FilePath launcher-repair.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path launcher-repair.txt -Pattern 'could not be imported from \.venv' -Quiet)) {
            Write-Error 'A .venv without the game should be repaired.'; exit 1
          }
          .\scripts\Start-BattleDice.ps1 -NoLaunch 6>&1 | Tee-Object -FilePath launcher-settled.txt
          if (-not (Select-String -Path launcher-settled.txt -Pattern 'already installed and up to date' -Quiet)) {
            Write-Error 'After the repair the launcher should find everything in place.'; exit 1
          }

      - name: Launcher start-up path runs the game (hidden self-check), in both PowerShell editions
        shell: pwsh
        run: |
          foreach ($shell in @('powershell.exe', 'pwsh.exe')) {
            $output = & $shell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Start-BattleDice.ps1 -SmokeTest 6>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Output $output
            if ($code -ne 0) { Write-Error "${shell}: the launcher passed on exit code $code from the game."; exit 1 }
            if ($output -notmatch 'SMOKE TEST OK') { Write-Error "${shell}: the game did not report a successful self-check."; exit 1 }
          }

      - name: Double-click wrapper runs the launcher
        shell: cmd
        run: call Play-BattleDice.cmd -NoLaunch

      - name: Smoke-test the source install made by the launcher
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m battle_dice --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the standalone app
        shell: pwsh
        run: |
          python -m pip install ".[package]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller packaging/battle_dice.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test the standalone app
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'smoke-exe.txt'
          $process = Start-Process -FilePath 'dist\BattleDice\BattleDice.exe' `
            -ArgumentList '--smoke-test', '--smoke-out', "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { Write-Error "BattleDice.exe exited with code $($process.ExitCode)."; exit 1 }
          if (-not (Select-String -Path $report -Pattern 'SMOKE TEST OK' -Quiet)) { Write-Error 'No success line in the smoke report.'; exit 1 }
          if (-not (Select-String -Path $report -Pattern 'frozen=True' -Quiet)) { Write-Error 'The smoke test did not run inside the packaged app.'; exit 1 }

      # The Class Evolution catalog is package data. With the gate on, the app validates and loads it at
      # start, so this proves the standalone build contains it. (The gate is off by default.)
      # The check also plays a whole run with a Guardian built from that catalog (evolved_run=...).
      - name: Smoke-test the standalone app with the Class Evolution gate on
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'smoke-exe-gate.txt'
          $process = Start-Process -FilePath 'dist\BattleDice\BattleDice.exe' `
            -ArgumentList '--smoke-test', '--feature', 'class_evolution_v1', '--smoke-out', "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { Write-Error "BattleDice.exe exited with code $($process.ExitCode)."; exit 1 }
          if (-not (Select-String -Path $report -Pattern 'SMOKE TEST OK' -Quiet)) { Write-Error 'No success line in the smoke report.'; exit 1 }
          if (-not (Select-String -Path $report -Pattern 'features=class_evolution_v1' -Quiet)) { Write-Error 'The gate was not on in the packaged app.'; exit 1 }
          if (-not (Select-String -Path $report -Pattern 'evolved_run=' -Quiet)) { Write-Error 'The packaged app did not play the run with a hero from the vocation catalog.'; exit 1 }

      # Upload the dist folder itself, so the downloaded zip unpacks straight to BattleDice\BattleDice.exe
      # (uploading a zip made here would give a zip inside the downloaded zip).
      - uses: actions/upload-artifact@v7
        with:
          name: BattleDice-windows-x64
          path: dist/
          if-no-files-found: error
