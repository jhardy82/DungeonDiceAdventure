name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools packaging
      - name: Type-check the whole package, the tools and the tests
        run: python -m mypy src/battle_dice tools tests
      - name: Test, with a coverage floor for the rules engine, content loader and random numbers
        # PRD target: at least 80% line coverage. Measured 97%; the floor is set at 90% so a real drop fails.
        # Warnings are errors: a deprecation or a resource leak fails the build instead of scrolling past.
        run: python -m pytest -W error --cov=battle_dice.core --cov=battle_dice.content --cov=battle_dice.rng --cov=battle_dice.career --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Build the wheel and run the game from the installed copy
        # Proves the packaged files (content, schema, sprites, entry points) are complete, not just the source tree.
        shell: bash
        run: |
          python -m pip install build
          python -m build --outdir wheel_check
          python -m pip install --force-reinstall --no-deps wheel_check/*.whl
          cd wheel_check
          python -m battle_dice --smoke-test
          python -m battle_dice --version
          python -m battle_dice.sim.runner --seeds 1 --sizes 1
          # The Class Evolution catalog is package data too: load it from the installed copy, gate on.
          python -m battle_dice --smoke-test --feature class_evolution_v1
          python -c "from battle_dice.content.loader import load_content; from battle_dice.content.vocations import load_vocation_catalog as load; c = load(load_content()); print('vocation catalog', c.version, sorted(c.builds))"
