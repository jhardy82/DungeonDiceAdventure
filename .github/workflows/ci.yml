name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools packaging
      - name: Type-check the rules engine, content, simulator, controller and replay tool
        run: python -m mypy src/battle_dice/core src/battle_dice/rng.py src/battle_dice/content src/battle_dice/sim src/battle_dice/app src/battle_dice/replay_cli.py
      - name: Test, with a coverage floor for the rules engine, content loader and random numbers
        # PRD target: at least 80% line coverage. Measured 97%; the floor is set at 90% so a real drop fails.
        run: python -m pytest --cov=battle_dice.core --cov=battle_dice.content --cov=battle_dice.rng --cov-report=term-missing:skip-covered --cov-fail-under=90
