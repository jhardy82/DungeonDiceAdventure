name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-on-the-phones-python:
    # The Android app embeds Python 3.14 (Flet's newest; docs/android/PLAN.md). The desktop game asks for 3.15.
    # The same suite runs here on 3.14, from the source tree: the package itself still says requires-python >= 3.15.
    name: Test on Python 3.14 (the Python inside the Android app)
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install what the game and its tests need (the package itself asks for 3.15)
        run: python -m pip install "pygame-ce>=2.5.8" "jsonschema>=4.20" "pytest>=8"
      - name: Test, warnings as errors
        run: python -m pytest -W error
      - name: Both self-checks
        run: |
          python -m battle_dice --smoke-test
          python -m battle_dice --smoke-test --feature class_evolution_v1

  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools packaging
      - name: Type-check the whole package, the tools and the tests
        run: python -m mypy src/battle_dice tools tests
      - name: Type-check once more as Python 3.14 (the Python inside the Android app)
        # Catches a use of something only 3.15 has, before the phone meets it. See docs/android/PLAN.md, phase 1.
        run: python -m mypy --python-version 3.14 src/battle_dice tools tests
      - name: Test, with a coverage floor for the rules engine, content loader and random numbers
        # PRD target: at least 80% line coverage. Measured 97%; the floor is set at 90% so a real drop fails.
        # Warnings are errors: a deprecation or a resource leak fails the build instead of scrolling past.
        run: python -m pytest -W error --cov=battle_dice.core --cov=battle_dice.content --cov=battle_dice.rng --cov=battle_dice.career --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Build the wheel and run the game from the installed copy
        # Proves the packaged files (content, schema, sprites, entry points) are complete, not just the source tree.
        shell: bash
        run: |
          python -m pip install build
          python -m build --outdir wheel_check
          python -m pip install --force-reinstall --no-deps wheel_check/*.whl
          cd wheel_check
          python -m battle_dice --smoke-test
          python -m battle_dice --version
          python -m battle_dice.sim.runner --seeds 1 --sizes 1
          # The Class Evolution catalog is package data too: load it from the installed copy, gate on.
          python -m battle_dice --smoke-test --feature class_evolution_v1
          python -c "from battle_dice.content.loader import load_content; from battle_dice.content.vocations import load_vocation_catalog as load; c = load(load_content()); print('vocation catalog', c.version, sorted(c.builds))"
          # The save-database script is package data as well: create a save from the installed copy.
          python -c "from battle_dice.content.loader import load_content; from battle_dice.content.vocations import load_catalog; from battle_dice.career.catalog import CareerCatalog; from battle_dice.career.store import SqliteProfileStore as S; s = S(':memory:', CareerCatalog(load_catalog(), load_content())); print('save schema', s.schema_version()); s.close()"
